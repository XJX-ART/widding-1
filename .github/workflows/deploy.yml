name: Deploy Exact Wedding ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from original template and exact wedding page
        run: |
          rm -rf site
          git clone --depth 1 https://github.com/tutouxiaozhou/stardew-wedding-template.git site
          rm -rf site/.git
          cp "$GITHUB_WORKSPACE/index.html" site/index.html
          cp "$GITHUB_WORKSPACE/assets/pixel-couple.svg" site/assets/pixel-couple.svg
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

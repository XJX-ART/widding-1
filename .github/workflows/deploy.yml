name: Deploy Exact Wedding ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build from original template and exact ZIP files
        run: |
          rm -rf site
          git clone --depth 1 https://github.com/tutouxiaozhou/stardew-wedding-template.git site
          rm -rf site/.git
          python3 - <<'PY2'
          import base64
          from pathlib import Path
          files = {
            'index.html': '',
            'assets/pixel-couple.svg': 'PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTYwIiB2aWV3Qm94PSIwIDAgMTYwIDE2MCI+PHBhdGggZmlsbD0iI0ZmYzY2OCIIGQ9Ik0yMCAxMDBoMTIwdjIwaC0xMjB6Ii8+PC9zdmc+',
            'assets/share-cover.svg': 'PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjYzMCI+PHJlY3Qgd2lkdGg9IjEyMDAiIGhlaWdodD0iNjMwIiBmaWxsPSIjMTcyNDVmIi8+PHRleHQgeD0iNjAwIiB5PSIzMjAiIGZpbGw9IndoaXRlIiBmb250LXNpemU9IjY0IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7miqXlhaznq5QgJiDovbTlpb2VuPC90ZXh0Pjwvc3ZnPg=='
          }
          for path, data in files.items():
              p=Path('site')/path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(data))
          PY2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
